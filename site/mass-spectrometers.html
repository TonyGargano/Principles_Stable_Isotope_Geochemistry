<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mass Spectrometers</title>
<meta name="description" content="Interactive schematics of a gas source IRMS (Thermo MAT 253) and an MC-ICP-MS (Thermo Neptune Plus) set up for K and Rb isotopes, with notes on how Tony Gargano uses each.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink2: #52514e;
  --muted: #898781;
  --hair: #e1e0d9;
  --border: rgba(11,11,11,0.10);
  --own: #6f5587;
  --ion: #2a78d6;
  --heat: #eb6834;
  --metal: #52514e;
  --fill: #f3f2ee;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body {
  font-family: "Epilogue", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.ms { max-width: 1240px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px 14px; }
.ms-head { margin: 0 0 12px; }
.ms-head h1 { font-size: 22px; font-weight: 500; margin: 0 0 2px; letter-spacing: -0.01em; }
.ms-head p { margin: 0; color: var(--ink2); font-size: 14px; }
html.embed .ms-head { display: none; }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; cursor: pointer; padding: 7px 15px; font-size: 13.5px; border-right: 1px solid var(--ink); transition: background-color .15s, color .15s; }
.seg button:last-child { border-right: 0; }
.seg button[aria-checked="true"] { background: var(--ink); color: #fff; }
.seg button:not([aria-checked="true"]):hover { background: rgba(11,11,11,0.06); }
.pick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pick:empty { display: none; }
.pick-lab { font-size: 12.5px; color: var(--ink2); margin-right: 2px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; line-height: 1.2; color: var(--ink); }
.chip b { font-weight: 600; }
.chip span { color: var(--ink2); }
.chip:hover { border-color: var(--ink2); }
.chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.intro { font-size: 14px; color: var(--ink2); margin: 0 0 8px; max-width: 100ch; }

/* schematic */
.schem { overflow-x: auto; padding: 2px 0 4px; }
.schem svg { display: block; width: 100%; min-width: 880px; height: auto; }
.scroll-hint { display: none; font-size: 12px; color: var(--muted); margin: 0 0 4px; }
.schem-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; font-size: 12.5px; color: var(--ink2); margin: 2px 0 0; }
.key { display: inline-flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key i { width: 20px; height: 0; display: inline-block; }
.key i.k-ion { border-top: 3px solid var(--ion); border-radius: 2px; }
.key i.k-gas { border-top: 2px dotted #6f6e69; }
.walk { border: 1px solid var(--ink); background: #fff; border-radius: 999px; padding: 5px 13px; font-size: 13px; cursor: pointer; }
.walk:hover { background: var(--ink); color: #fff; }

svg text { font-family: inherit; }
.t-title { font-size: 17px; font-weight: 600; fill: var(--ink); }
.t-sub { font-size: 12.5px; fill: var(--ink2); }
.t-note { font-size: 12px; fill: var(--muted); }
.p-name { font-size: 13px; font-weight: 600; fill: var(--ink); }
.p-sub { font-size: 11px; fill: var(--ink2); }
.p-small { font-size: 10.5px; fill: var(--muted); }
.badge-c { fill: var(--ink); }
.badge-t { fill: #fff; font-size: 11px; font-weight: 600; text-anchor: middle; }
.hw { fill: var(--fill); stroke: var(--metal); stroke-width: 1.4; }
.hw-w { fill: #fff; stroke: var(--metal); stroke-width: 1.4; }
.hw-line { fill: none; stroke: var(--metal); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.tube { fill: none; stroke: #d4d2ca; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.flow { fill: none; stroke: #6f6e69; stroke-width: 1.6; stroke-dasharray: 2 7; stroke-linecap: round; stroke-linejoin: round; animation: flowGas 1.6s linear infinite; }
.flight { fill: none; stroke: #ecebe6; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
.ion-base { fill: none; stroke: rgba(42,120,214,0.28); stroke-linecap: round; stroke-linejoin: round; }
.ion { fill: none; stroke: var(--ion); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 8; animation: flowIon 1s linear infinite; }
.guide { fill: none; stroke: #9a988f; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.heat { fill: none; stroke: var(--heat); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ln2 { fill: #dde9f7; }
.liquid { fill: #cfe1f6; }
.magnet { fill: #d9d7cf; stroke: #b7b5ac; stroke-width: 1.2; }
.esa { fill: none; stroke: #8d8b83; stroke-width: 6; stroke-linecap: round; }
.cup { fill: #fff; stroke: var(--metal); stroke-width: 1.4; stroke-linejoin: round; }
.cup.on { fill: #e3eefb; }
.cup.idle { stroke: #b9b7ae; }
.cup-t { font-size: 10px; fill: var(--ink); text-anchor: middle; font-variant-numeric: tabular-nums; }
.iso-t { font-size: 11.5px; fill: var(--ink); }
.box-t { font-size: 12px; fill: var(--ink); }
.box-t.strong { font-weight: 600; }
.cell-t { font-size: 12.5px; fill: var(--ink); text-anchor: middle; font-weight: 600; }
.cell-s { font-size: 11px; fill: var(--ink2); text-anchor: middle; }
.cell-n { font-size: 11.5px; fill: var(--muted); text-anchor: middle; }
@keyframes flowIon { to { stroke-dashoffset: -18; } }
@keyframes flowGas { to { stroke-dashoffset: -9; } }
.alt-a { animation: altA 5s steps(1, end) infinite; }
.alt-b { animation: altB 5s steps(1, end) infinite; }
@keyframes altA { 0% { stroke: #52514e; } 50% { stroke: #d6d4cc; } 100% { stroke: #d6d4cc; } }
@keyframes altB { 0% { stroke: #d6d4cc; } 50% { stroke: #52514e; } 100% { stroke: #52514e; } }

.shared { pointer-events: none; transition: opacity .2s; }
.part { cursor: pointer; outline: none; transition: opacity .2s; }
.part .hit { fill: transparent; stroke: transparent; stroke-width: 2; transition: fill .15s, stroke .15s; }
.part:hover .hit { fill: rgba(11,11,11,0.025); stroke: #d3d1c9; }
.part:focus-visible .hit { stroke: var(--ink); }
.part.is-sel .hit { fill: rgba(42,120,214,0.05); stroke: var(--ink); }
.part.off:not(.is-sel), .route.off { opacity: .3; }
svg.has-sel .part:not(.is-sel), svg.has-sel .shared, svg.has-sel .route { opacity: .28; }

/* panel beneath */
.panel { border-top: 1px solid var(--hair); margin-top: 12px; padding-top: 14px; }
.pbox { border: 1px solid var(--hair); background: #fff; border-radius: 14px; padding: 14px 16px 12px; }
.pbox-head { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.num { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex: none; margin-top: 1px; font-variant-numeric: tabular-nums; }
.pbox h3 { margin: 0; font-size: 19px; font-weight: 500; line-height: 1.2; outline: none; }
.pbox .sub { font-size: 12.5px; color: var(--ink2); margin-top: 2px; }
.pnav { margin-left: auto; display: flex; gap: 6px; }
.pnav button { border: 1px solid var(--hair); background: #fff; border-radius: 999px; height: 30px; min-width: 30px; padding: 0 11px; font-size: 12.5px; cursor: pointer; color: var(--ink2); }
.pnav button:hover { border-color: var(--ink2); color: var(--ink); }
.pnav button:disabled { opacity: .4; cursor: default; }
.pbody { margin-top: 10px; }
.pbody.with-chart { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.ptext { max-width: 80ch; }
.lead { font-size: 15px; margin: 0 0 10px; }
.ptext p { margin: 0 0 10px; font-size: 14px; }
.ptext p.route-note { font-size: 13px; color: var(--ink2); }
.research { border-left: 3px solid var(--own); padding: 2px 0 2px 12px; margin: 2px 0 12px; }
.research h4 { margin: 0 0 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); }
.research p { margin: 0; font-size: 14px; }
.src { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; line-height: 1.6; }
.src a { color: var(--ink2); text-decoration: underline; text-decoration-color: rgba(11,11,11,0.3); text-underline-offset: 2px; }
.src a:hover { color: var(--ink); text-decoration-color: var(--ink); }
.flag { display: inline-block; font-size: 10.5px; border-radius: 999px; padding: 0 6px; margin-right: 3px; border: 1px solid var(--hair); color: var(--ink2); background: #faf9f6; }
.flag.own { border-color: var(--own); color: var(--own); }
.ov h3 { font-size: 18px; }
.ov-steps { list-style: none; margin: 4px 0 12px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.ov-steps button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 3px 11px 3px 3px; font-size: 13px; cursor: pointer; }
.ov-steps button:hover { border-color: var(--ink2); }
.ov-steps .num { width: 22px; height: 22px; font-size: 11.5px; margin: 0; }

figure.chart { margin: 0; border: 1px solid var(--hair); background: #fff; border-radius: 12px; padding: 12px 12px 10px; position: relative; }
figure.chart + figure.chart { margin-top: 12px; }
figure.chart .ch-title { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
figure.chart .ch-sub { font-size: 12px; color: var(--ink2); margin: 0 0 6px; }
figure.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
figure.chart figcaption { font-size: 12px; color: var(--ink2); margin-top: 6px; }
.ch-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink2); margin: 0 0 4px; }
.ch-legend span { display: inline-flex; align-items: center; gap: 5px; }
.ch-legend i { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }
.svg-tick { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
.svg-lab { font-size: 11.5px; fill: var(--ink2); paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
.svg-val { font-size: 11px; fill: var(--ink); font-variant-numeric: tabular-nums; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
.svg-strong { font-weight: 600; fill: var(--ink); }

/* comparison */
.cmp-fig { margin: 0; overflow-x: auto; }
.cmp-fig svg { display: block; width: 100%; min-width: 880px; height: auto; }
.cmp-fig figcaption { font-size: 12.5px; color: var(--ink2); margin-top: 4px; }
.cmp-wrap { overflow-x: auto; margin-top: 12px; }
table.cmp { width: 100%; min-width: 600px; border-collapse: collapse; font-size: 13.5px; background: #fff; border: 1px solid var(--hair); border-radius: 12px; }
table.cmp th, table.cmp td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #efeee9; }
table.cmp tr:last-child th, table.cmp tr:last-child td { border-bottom: 0; }
table.cmp thead th { font-size: 12.5px; color: var(--ink2); font-weight: 600; border-bottom: 1px solid var(--hair); }
table.cmp tbody th { font-weight: 600; width: 18%; }
table.cmp td { width: 41%; }

.foot { margin-top: 10px; font-size: 12px; color: var(--muted); }
.tip { position: fixed; z-index: 40; pointer-events: none; background: #0b0b0b; color: #fff; font-size: 12px; padding: 5px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); line-height: 1.4; }
.tip[hidden] { display: none; }

@media (max-width: 900px) {
  .pbody.with-chart { grid-template-columns: minmax(0, 1fr); }
  .scroll-hint { display: block; }
}
@media (max-width: 700px) {
  .ms { padding: 14px 12px 10px; border-radius: 12px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; border-radius: 12px; }
  .seg button { font-size: 12.5px; padding: 8px 6px; line-height: 1.2; text-align: center; }
  .pnav { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .ion, .flow, .alt-a, .alt-b { animation: none; }
  .ion, .flow { stroke-dasharray: none; }
  .part, .part .hit, .shared, .seg button { transition: none; }
}
@media (forced-colors: active) {
  .part.is-sel .hit { stroke: Highlight; }
}
</style>
</head>
<body>
<div class="ms" id="ms">
  <div class="ms-head">
    <h1>Mass spectrometers</h1>
    <p>How a gas source IRMS and an MC-ICP-MS measure isotope ratios. Tony Gargano, Center for Stable Isotopes, University of New Mexico.</p>
  </div>
  <div class="controls">
    <div class="seg" role="radiogroup" aria-label="Instrument">
      <button type="button" role="radio" data-inst="irms">Gas source IRMS</button>
      <button type="button" role="radio" data-inst="mc">MC-ICP-MS</button>
      <button type="button" role="radio" data-inst="cmp">Gas vs liquid</button>
    </div>
    <div class="pick" id="pick"></div>
  </div>
  <p class="intro" id="intro"></p>
  <div id="stage"></div>
  <section class="panel" id="panel" aria-live="polite"></section>
  <div class="foot">Simplified schematics, not to scale.</div>
</div>
<div class="tip" id="tip" hidden></div>

<script>
(() => {
"use strict";
const params = new URLSearchParams(location.search);
if (params.get("embed") === "1") document.documentElement.classList.add("embed");

const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const tip = $("tip"), stage = $("stage"), panel = $("panel");

/* ---------- references ---------- */
const REF = {
  mat: ["Thermo MAT 253 manual", "https://cactiweb.uvigo.es/docs/manuales/MAT253.pdf"],
  csi: ["UNM Center for Stable Isotopes", "https://csi.unm.edu/node/185"],
  rumble: ["Rumble et al. (1997), GCA 61, 4229", "https://faculty.epss.ucla.edu/~eyoung/reprints/Rumble_etal_1997.pdf"],
  uw: ["UW IsoLab triple oxygen protocol", "https://isolab.ess.washington.edu/laboratory/water-D17O.php"],
  zhang: ["Zhang, Nie and Lin (2025), JAAS", "https://doi.org/10.1039/d5ja00189g"],
  chen: ["Chen et al. (2019), JAAS 34, 160", "https://doi.org/10.1039/C8JA00303C"],
  nie: ["Nie and Dauphas (2019), ApJL", "https://arxiv.org/abs/1910.08530"],
  neptune: ["Thermo Fisher, Neptune Plus", "https://www.thermofisher.com/order/catalog/product/IQLAAEGAASFADOMAJL"],
  nubase: ["NUBASE2020", null],
  ame: ["AME2020", null],
  nist: ["NIST", null]
};
const ref = k => { const r = REF[k]; return r[1] ? '<a href="' + r[1] + '" target="_blank" rel="noopener">' + r[0] + '</a>' : r[0]; };
function flags(f) {
  const out = [];
  if (f.own) out.push('<span class="flag own">my work</span>' + f.own);
  if (f.pub) out.push('<span class="flag">published</span>' + f.pub);
  if (f.con) out.push('<span class="flag">constructed</span>' + f.con);
  return '<p class="src">' + out.join(" ") + '</p>';
}

/* ---------- gases and elements ---------- */
const GASES = {
  O2: { key: "O2", chip: "O₂", el: "oxygen", route: "dual", method: "Laser fluorination", reagent: "BrF₅", laser: true,
    beams: [{ m: 32, sp: "¹⁶O¹⁶O", ab: 99.515 }, { m: 33, sp: "¹⁶O¹⁷O", ab: 0.0765 }, { m: 34, sp: "¹⁶O¹⁸O", ab: 0.408 }],
    ratios: [["33/32", "δ¹⁷O"], ["34/32", "δ¹⁸O"]], extra: "both → Δ′¹⁷O" },
  SF6: { key: "SF6", chip: "SF₆", el: "sulfur", route: "dual", method: "Fluorination to SF₆", reagent: "F₂, nickel vessel",
    beams: [{ m: 127, sp: "³²SF₅⁺", ab: 94.85 }, { m: 128, sp: "³³SF₅⁺", ab: 0.763 }, { m: 129, sp: "³⁴SF₅⁺", ab: 4.365 }, { m: 131, sp: "³⁶SF₅⁺", ab: 0.0158 }],
    ratios: [["128/127", "δ³³S"], ["129/127", "δ³⁴S"], ["131/127", "δ³⁶S"]] },
  CH3Cl: { key: "CH3Cl", chip: "CH₃Cl", el: "chlorine", route: "cf", method: "Methyl chloride synthesis", reagent: "AgCl + CH₃I",
    beams: [{ m: 50, sp: "CH₃³⁵Cl⁺", ab: 74.96 }, { m: 52, sp: "CH₃³⁷Cl⁺", ab: 23.93 }],
    ratios: [["52/50", "δ³⁷Cl"]] },
  H2: { key: "H2", chip: "H₂", el: "hydrogen", route: "cf", method: "High-temperature conversion", reagent: "glassy carbon",
    beams: [{ m: 2, sp: "H₂⁺", ab: 99.971 }, { m: 3, sp: "HD⁺", ab: 0.029 }],
    ratios: [["3/2", "δD"]] }
};
const ELS = {
  K: { key: "K", chip: "K", name: "potassium", delta: "δ⁴¹K", std: "NIST SRM 3141a", stdShort: "vs SRM 3141a",
    beams: [{ m: 39, sp: "³⁹K", ab: 93.258, k: 6 }, { m: 41, sp: "⁴¹K", ab: 6.730, k: 2 }],
    interf: { key: "K", a: "⁴¹K", b: "⁴⁰Ar¹H⁺", mA: 40.96182525, d: 0.008383, R: 9000, rel: 0.25, lo: -2, hi: 16 } },
  Rb: { key: "Rb", chip: "Rb", name: "rubidium", delta: "δ⁸⁷Rb", std: "NIST SRM 984", stdShort: "vs SRM 984",
    beams: [{ m: 85, sp: "⁸⁵Rb", ab: 72.17, k: 6 }, { m: 87, sp: "⁸⁷Rb", ab: 27.83, k: 4 }, { m: 88, sp: "⁸⁸Sr", ab: null, k: 3, monitor: true }],
    interf: { key: "Rb", a: "⁸⁷Rb", b: "⁸⁷Sr", mA: 86.90918053, d: -0.000303, R: 9000, rel: 0.25, lo: -3, hi: 14 } }
};

/* ---------- part content ---------- */
const IRMS_OVERVIEW = {
  title: "How the gas source IRMS works",
  lead: "Light elements like oxygen, sulfur, chlorine and hydrogen form simple gases, so the sample is converted to one pure gas before it reaches the instrument. Inside, the gas is ionized and accelerated, and a magnet splits the beam by mass so that each isotope variant lands in its own collector. Comparing those ratios with a reference gas gives the isotope composition.",
  mine: "I have measured H, O, S and Cl isotopes by IRMS, and I design, build and maintain the high-vacuum extraction lines that feed these instruments. Triple oxygen isotopes, with δ¹⁷O and δ¹⁸O measured together, run through my lunar regolith and early solar system work.",
  flags: () => flags({ own: "Instrument experience (CV).", con: "Description." })
};
const MC_OVERVIEW = {
  title: "How the MC-ICP-MS works",
  lead: "Metals like potassium and rubidium do not form convenient gases, so they go in as a liquid. The rock is dissolved and the element purified, then the solution is sprayed into an argon plasma hot enough to ionize nearly every atom. An electrostatic analyzer and a magnet sort the ions by energy and by mass, and a row of collectors measures the isotopes at the same moment.",
  mine: "I measure K isotopes by solution MC-ICP-MS on a Thermo Neptune Plus, from digestion and column chemistry through to the measurement. Rb isotopes, measured the same way, are part of the alkali vapor and melt experiments I have proposed as lead PI.",
  flags: () => flags({ own: "Instrument experience and proposed work (CV).", con: "Description." })
};

const IRMS_PARTS = [
  { id: "extract", n: 1, title: "Extraction line", sub: g => g.method,
    lead: () => "Most of the work happens before the mass spectrometer. The extraction line is a glass and metal vacuum system that turns a solid or liquid sample into one pure gas, ready for measurement.",
    body: g => ({
      O2: ["For oxygen, a CO₂ laser heats a small silicate sample in bromine pentafluoride (BrF₅), which releases its oxygen as O₂. Liquid nitrogen traps freeze out the excess reagent and by-products, and a gas chromatograph column purifies the O₂.", "Nitrogen trifluoride has to go, because its NF⁺ fragment lands on mass 33, the same mass as ¹⁶O¹⁷O."],
      SF6: ["For sulfur, sulfide is converted to silver sulfide and heated with fluorine gas in a nickel vessel, making sulfur hexafluoride (SF₆). Cryogenic traps and a gas chromatograph then purify it.", "Fluorine has only one isotope, so each mass in the spectrum maps to a single sulfur isotope."],
      CH3Cl: ["For chlorine, chloride is precipitated as silver chloride and reacted with methyl iodide (CH₃I) to make methyl chloride (CH₃Cl). A gas chromatograph separates the CH₃Cl from leftover CH₃I on its way to the instrument."],
      H2: ["For hydrogen, water is converted to H₂ by reaction with hot glassy carbon, and a stream of helium carries the H₂ to the instrument."]
    })[g.key],
    mine: () => "I design, build and maintain high-vacuum glass and metal lines like this, including laser fluorination systems and fluorination pressure vessels for oxygen, with cryogenic traps and GC interfaces for purification.",
    flags: g => flags({ own: "Extraction lines and fluorination methods I use (CV).", pub: g.key === "O2" ? "NF⁺ on mass 33, " + ref("rumble") + ". GC purification before the dual inlet, " + ref("csi") + "." : null, con: "Description." }) },
  { id: "dual", n: 2, title: "Dual inlet", sub: () => "Sample against reference",

function S(tag, attrs, ...kids) {

}
const T = (x, y, s, cls, extra) => S("text", Object.assign({ x, y, class: cls }, extra || {}), s);

const r1 = v => Math.round(v * 10) / 10;
function pt(cx, cy, r, deg) { const a = deg * Math.PI / 180; return [r1(cx + r * Math.cos(a)), r1(cy + r * Math.sin(a))]; }
function arc(cx, cy, r, a1, a2) { const p1 = pt(cx, cy, r, a1), p2 = pt(cx, cy, r, a2); return "M" + p1.join(" ") + " A" + r + " " + r + " 0 0 " + (a2 > a1 ? 1 : 0) + " " + p2.join(" "); }
function sector(cx, cy, ri, ro, a1, a2) {
  const p1 = pt(cx, cy, ro, a1), p2 = pt(cx, cy, ro, a2), p3 = pt(cx, cy, ri, a2), p4 = pt(cx, cy, ri, a1);
  return "M" + p1.join(" ") + " A" + ro + " " + ro + " 0 0 1 " + p2.join(" ") + " L" + p3.join(" ") + " A" + ri + " " + ri + " 0 0 0 " + p4.join(" ") + " Z";
}
function zigzag(x1, y, x2, amp, n) { let d = "M" + x1 + " " + y; const step = (x2 - x1) / n; for (let i = 1; i <= n; i++) d += " L" + r1(x1 + step * (i - 0.5)) + " " + (y + (i % 2 ? -amp : amp)) + " L" + r1(x1 + step * i) + " " + y; return d; }
function pipe(d, live) { return [S("path", { class: "tube", d }), live ? S("path", { class: "flow", d }) : null]; }
function arrowHead(x, y, dir) { const s = 5; const pts = dir === "right" ? [[x, y], [x - s * 1.6, y - s], [x - s * 1.6, y + s]] : dir === "down" ? [[x, y], [x - s, y - s * 1.6], [x + s, y - s * 1.6]] : [[x, y], [x - s, y + s * 1.6], [x + s, y + s * 1.6]]; return S("polygon", { points: pts.map(p => p.join(",")).join(" "), fill: "#9a988f" }); }
function beamWidth(ab) { return ab == null ? 1.4 : ab >= 50 ? 4 : ab >= 1 ? 2.6 : 1.6; }

  s.appendChild(line(x => fA(x) + fB(x), C.s, 2)); s.appendChild(line(fA, C.a, 2)); s.appendChild(line(fB, C.b, 2));
  if (!(win[1] > win[0])) s.appendChild(S("text", { x: X(I.hi) - 4, y: Y(0.45), "text-anchor": "end", class: "svg-lab svg-strong" }, "no clean window"));
  const cross = S("line", { x1: 0, x2: 0, y1: m.t, y2: m.t + ph, stroke: "#c3c2b7", "stroke-width": 1, visibility: "hidden" }); s.appendChild(cross);
  const hit = S("rect", { x: m.l, y: m.t, width: pw, height: ph, fill: "transparent" }); s.appendChild(hit);
  hit.addEventListener("pointermove", ev => {
    const r = s.getBoundingClientRect(), sx = (ev.clientX - r.left) * (W / r.width);
    const x = Math.max(I.lo, Math.min(I.hi, I.lo + (sx - m.l) / pw * (I.hi - I.lo)));
    cross.setAttribute("x1", X(x)); cross.setAttribute("x2", X(x)); cross.setAttribute("visibility", "visible");
    showTipAt(ev.clientX, ev.clientY - 6, "<b>" + (x >= 0 ? "+" : "") + x.toFixed(1) + "</b> thousandths<br>" + I.a + " " + fA(x).toFixed(2) + "<br>" + I.b + " " + fB(x).toFixed(2) + "<br>Sum " + (fA(x) + fB(x)).toFixed(2));
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); tip.hidden = true; });
  host.appendChild(s);
  const t = document.createElement("div"); t.className = "sr-only";
  t.innerHTML = "<table><caption>Signal by magnet setting</caption><tr><th>Setting</th><th>" + I.a + "</th><th>" + I.b + "</th><th>Sum</th></tr>" + [I.lo, 0, 2, 4, 6, 8, 10, 12, 14].filter(v => v >= I.lo && v <= I.hi).map(v => "<tr><td>" + v + "</td><td>" + fA(v).toFixed(2) + "</td><td>" + fB(v).toFixed(2) + "</td><td>" + (fA(v) + fB(v)).toFixed(2) + "</td></tr>").join("") + "</table>";
  host.appendChild(t);
}
function chartHtml(kind) {
  const c = cur();
  if (kind === "beams") {
    const title = "How big each beam is";
    const sub = state.inst === "irms" ? "Share of the " + c.chip + " in each collected beam, log scale" : "Share of " + c.name + " in each collected beam, log scale";
    const cap = state.inst === "irms" ? "Calculated from isotope abundances (NUBASE2020)." : (state.el === "Rb" ? "⁸⁸Sr is a monitor and should be near zero after chemistry. Abundances from NUBASE2020." : "⁴⁰K (0.0117%) is not collected. Abundances from NUBASE2020.");
    return '<figure class="chart" data-chart="beams"><p class="ch-title">' + title + '</p><p class="ch-sub">' + sub + '</p><div class="ch-body"></div><figcaption>' + cap + '</figcaption></figure>';
  }
  const I = ELS[state.el].interf;
  const title = I.key === "K" ? "Measuring ⁴¹K on the clean edge" : "⁸⁷Sr hides under ⁸⁷Rb";
  const sub = I.key === "K" ? "Leading edge of the mass 41 peak at high resolution (about 9,000)" : "Leading edges at mass 87, even at high resolution (about 9,000)";
  const cap = I.key === "K" ? "With a wide collector, each beam makes a flat-topped peak. ⁴¹K is 0.0084 u lighter than ⁴⁰Ar¹H⁺, so it enters the cup first, and the narrow window before the hydride arrives is where ⁴¹K is measured. Hydride size is illustrative." : "⁸⁷Sr is 0.0003 u lighter than ⁸⁷Rb, far less than the width of the peak edge, so no magnet setting separates them. Strontium is removed in the chemistry instead. Strontium size is illustrative.";
  return '<figure class="chart" data-chart="edge"><p class="ch-title">' + title + '</p><p class="ch-sub">' + sub + '</p><div class="ch-legend"></div><div class="ch-body"></div><figcaption>' + cap + '</figcaption></figure>';
}
function drawCharts() { panel.querySelectorAll("figure.chart").forEach(f => f.dataset.chart === "beams" ? drawBeamChart(f) : drawEdgeChart(f)); }

/* ---------- rendering ---------- */
function renderControls() {
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.inst === state.inst)));
  const pick = $("pick");
  if (state.inst === "irms") pick.innerHTML = '<span class="pick-lab">Gas</span>' + Object.values(GASES).map(g => '<button type="button" class="chip" data-gas="' + g.key + '" aria-pressed="' + (g.key === state.gas) + '"><b>' + g.chip + '</b><span>' + g.el + '</span></button>').join("");
  else if (state.inst === "mc") pick.innerHTML = '<span class="pick-lab">Element</span>' + Object.values(ELS).map(e => '<button type="button" class="chip" data-el="' + e.key + '" aria-pressed="' + (e.key === state.el) + '"><b>' + e.chip + '</b><span>' + e.name + '</span></button>').join("");
  else pick.innerHTML = "";
  $("intro").textContent = state.inst === "irms" ? "Light elements are converted to a simple gas before measurement. Pick a gas to see how the inlet and collectors change, then click any numbered part."
    : state.inst === "mc" ? "Metals are dissolved, purified and sprayed in as a liquid. Pick an element to see how its interferences are handled, then click any numbered part."
    : "One instrument takes gas, the other takes liquid. Here is where they part ways.";
}
function renderStage() {
  if (state.inst === "cmp") { renderCmp(); return; }
  stage.innerHTML = "";
  const hint = document.createElement("p"); hint.className = "scroll-hint"; hint.textContent = "Scroll sideways to see the whole instrument."; stage.appendChild(hint);
  const wrap = document.createElement("div"); wrap.className = "schem"; wrap.id = "schem";
  wrap.appendChild(state.inst === "irms" ? drawIRMS() : drawMC());
  stage.appendChild(wrap);
  const foot = document.createElement("div"); foot.className = "schem-foot";
  foot.innerHTML = '<span class="key"><span><i class="k-ion"></i>Ion beams, thicker for bigger beams</span><span><i class="k-gas"></i>' + (state.inst === "irms" ? "Gas on the move" : "Sample aerosol on the move") + '</span></span><button type="button" class="walk" data-walk="1">Walk through it in order</button>';
  stage.appendChild(foot);
  applySel();
}
function applySel() {
  const svg = stage.querySelector(".schem svg"); if (!svg) return;
  svg.classList.toggle("has-sel", !!state.part);
  svg.querySelectorAll(".part").forEach(p => {
    const on = p.dataset.part === state.part;
    p.classList.toggle("is-sel", on); p.setAttribute("aria-pressed", String(on));
    if (state.inst === "irms") { const g = GASES[state.gas]; p.classList.toggle("off", (p.dataset.part === "dual" && g.route !== "dual") || (p.dataset.part === "cf" && g.route !== "cf")); }
  });
}
function paras(arr) {
  return arr.map(p => typeof p === "string" ? "<p>" + p + "</p>" : '<p class="route-note">' + p.note + "</p>").join("");
}
function renderPanel(focusTitle) {
  if (state.inst === "cmp") return;
  const c = cur(), parts = PARTS();
  if (!state.part) {
    const ov = state.inst === "irms" ? IRMS_OVERVIEW : MC_OVERVIEW;
    panel.innerHTML = '<div class="pbox ov"><h3>' + ov.title + '</h3><div class="ptext"><p class="lead" style="margin-top:6px">' + ov.lead + '</p></div>' +
      '<ol class="ov-steps" aria-label="Parts in order">' + parts.map(p => '<li><button type="button" data-goto="' + p.id + '"><span class="num">' + p.n + '</span>' + p.title + '</button></li>').join("") + '</ol>' +
      '<section class="research"><h4>In my work</h4><p>' + ov.mine + '</p></section>' + ov.flags() + '</div>';
    return;
  }
  const i = parts.findIndex(p => p.id === state.part), P = parts[i];
  const body = P.body(c), mine = P.mine ? P.mine(c) : null;
  const text = '<div class="ptext"><p class="lead">' + P.lead(c) + '</p>' + paras(body) + (mine ? '<section class="research"><h4>In my work</h4><p>' + mine + '</p></section>' : "") + '</div>';
  panel.innerHTML = '<div class="pbox"><header class="pbox-head"><span class="num">' + P.n + '</span><div><h3 tabindex="-1" id="pTitle">' + P.title + '</h3><div class="sub">' + P.sub(c) + '</div></div>' +
    '<div class="pnav"><button type="button" data-goto="' + (i > 0 ? parts[i - 1].id : "") + '"' + (i > 0 ? "" : " disabled") + ' aria-label="Previous part">← Prev</button><button type="button" data-goto="' + (i < parts.length - 1 ? parts[i + 1].id : "") + '"' + (i < parts.length - 1 ? "" : " disabled") + ' aria-label="Next part">Next →</button><button type="button" data-close="1" aria-label="Close and show the overview">×</button></div></header>' +
    '<div class="pbody' + (P.chart ? " with-chart" : "") + '">' + text + (P.chart ? '<div>' + chartHtml(P.chart) + '</div>' : "") + '</div>' + P.flags(c) + '</div>';
  drawCharts();
  if (focusTitle) { const h = $("pTitle"); if (h) h.focus({ preventScroll: true }); }
}
function render(opts) { renderControls(); renderStage(); renderPanel(opts && opts.focus); updateHash(); postHeight(); }

/* ---------- actions ---------- */
function selectPart(id, focus) {
  if (!PARTS().some(p => p.id === id)) return;
  state.part = id; applySel(); renderPanel(focus); updateHash(); postHeight();
}
function closePart() { const was = state.part; state.part = null; applySel(); renderPanel(); updateHash(); postHeight(); const g = was && stage.querySelector('.part[data-part="' + was + '"]'); if (g) g.focus({ preventScroll: true }); }

document.addEventListener("click", ev => {
  const t = ev.target;
  const seg = t.closest(".seg button");
  if (seg) { if (seg.dataset.inst !== state.inst) { state.inst = seg.dataset.inst; state.part = null; render(); } return; }
  const gc = t.closest("[data-gas]"); if (gc) { if (gc.dataset.gas !== state.gas) { state.gas = gc.dataset.gas; render(); } return; }
  const ec = t.closest("[data-el]"); if (ec) { if (ec.dataset.el !== state.el) { state.el = ec.dataset.el; render(); } return; }
  const pg = t.closest && t.closest(".part"); if (pg) { tip.hidden = true; if (state.part === pg.dataset.part) closePart(); else selectPart(pg.dataset.part); return; }
  const go = t.closest("[data-goto]"); if (go && go.dataset.goto) { selectPart(go.dataset.goto, true); return; }
  if (t.closest("[data-close]")) { closePart(); return; }
  if (t.closest("[data-walk]")) { selectPart(PARTS()[0].id, true); return; }
});
document.addEventListener("keydown", ev => {
  const pg = ev.target.closest && ev.target.closest(".part");
  if (pg && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); if (state.part === pg.dataset.part) closePart(); else selectPart(pg.dataset.part); return; }
  if (pg && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")) {
    ev.preventDefault(); const all = [...stage.querySelectorAll(".part")]; const i = all.indexOf(pg);
    const n = all[(i + (ev.key === "ArrowRight" ? 1 : all.length - 1)) % all.length]; if (n) n.focus(); return;
  }
  if (ev.key === "Escape" && state.part) { ev.preventDefault(); closePart(); }
});

/* ---------- hash + height ---------- */
function updateHash() {
  const p = new URLSearchParams(); p.set("inst", state.inst);
  if (state.inst === "irms") p.set("gas", state.gas); if (state.inst === "mc") p.set("el", state.el);
  if (state.part) p.set("part", state.part);
  try { history.replaceState(null, "", location.pathname + location.search + "#" + p.toString()); } catch (_) {}
}
let lastH = 0;
function postHeight() {
  if (window.parent === window) return;
  const h = Math.ceil($("ms").getBoundingClientRect().height + 4);
  if (Math.abs(h - lastH) < 2) return; lastH = h;
  try { window.parent.postMessage({ type: "gg-ms-height", height: h }, "*"); } catch (_) {}
}
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { drawCharts(); postHeight(); }, 120); });
if (window.ResizeObserver) new ResizeObserver(() => postHeight()).observe($("ms"));
window.addEventListener("load", postHeight);

/* ---------- init ---------- */
const hp = new URLSearchParams(location.hash.slice(1));
if (["irms", "mc", "cmp"].includes(hp.get("inst"))) state.inst = hp.get("inst");
if (GASES[hp.get("gas")]) state.gas = hp.get("gas");
if (ELS[hp.get("el")]) state.el = hp.get("el");
if (hp.get("part") && PARTS().some(p => p.id === hp.get("part"))) state.part = hp.get("part");
render();
})();
</script>
</body>
</html>
